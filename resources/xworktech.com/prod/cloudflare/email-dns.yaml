apiVersion: gitops.svc.plus/v1alpha1
kind: EmailDnsConfig
metadata:
  name: xworktech-transactional-email
  project: xworktech.com
  environment: prod
spec:
  provider: cloudflare
  # This policy is consumed by the playbook; CI must validate it before any apply.
  validation:
    required_from_addresses: 4
    requires_single_apex_spf: true
    production_apply_requires_explicit_opt_in: true
  zone: xworktech.com
  resend:
    domain: xworktech.com
    spf_include: include:amazonses.com
    from_addresses:
      - no-reply@xworktech.com
      - support@xworktech.com
      - billing@xworktech.com
      - security@xworktech.com
  google_workspace:
    mx:
      - {name: xworktech.com, type: MX, content: aspmx.l.google.com, priority: 1}
      - {name: xworktech.com, type: MX, content: alt1.aspmx.l.google.com, priority: 5}
      - {name: xworktech.com, type: MX, content: alt2.aspmx.l.google.com, priority: 5}
      - {name: xworktech.com, type: MX, content: alt3.aspmx.l.google.com, priority: 10}
      - {name: xworktech.com, type: MX, content: alt4.aspmx.l.google.com, priority: 10}
    spf_include: include:_spf.google.com
    # Google generates the key pair in Admin console -> Apps -> Google Workspace
    # -> Gmail -> Authenticate email; only the public half lands in DNS, so it
    # belongs in GitOps rather than Vault. This record predates the reconciler
    # and was created by hand; it is declared here so rotations go through CI.
    dkim:
      - name: google._domainkey.xworktech.com
        type: TXT
        selector: google
        ttl: 3600
        content: "v=DKIM1;k=rsa;"
  dmarc:
    name: _dmarc.xworktech.com
    value: "v=DMARC1; p=none; rua=mailto:security@xworktech.com; adkim=s; aspf=s"
    ttl: 3600
