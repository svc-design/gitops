apiVersion: gitops.svc.plus/v1alpha1
kind: FixedEgressNodes
metadata:
  name: xconnect
  project: svc.plus
  environment: prod
spec:
  # A regional node can be backed by Terraform CMDB facts or by a manually
  # provisioned host.  The connection source on each node is authoritative;
  # this manifest deliberately contains no credential material.
  lifecycle: hybrid
  provider: mixed
  plan:
    tier: standard
    cpu: 1
    memory_gb: 1
    system_disk_gb: 40
    bandwidth_mbps: 30
    traffic_gb_per_month: 200
    price_cny_per_month: 34
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: JP-XConnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: jp-01
        dns_record:
          type: A
          target_node: jp-01
          ttl: 1
          proxied: false
      legacy_cname: tky-proxy.svc.plus
      legacy_cname_target: JP-XConnect.svc.plus
      nodes:
        - id: jp-01
          connection_source: terraform_cmdb
          cmdb_selector:
            node_id: ap-prod-tky
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: US-XConnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: us-01
        dns_record:
          type: A
          target_node: us-01
          ttl: 1
          proxied: false
      nodes:
        - id: us-01
          connection_source: terraform_cmdb
          cmdb_selector:
            node_id: ap-prod-us
          enabled: true
          role: standalone
          weight: 100
    - name: hk
      region: hk
      entrypoint:
        fqdn: HK-XConnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: hk-01
        dns_record:
          type: A
          target_node: hk-01
          ttl: 1
          proxied: false
      nodes:
        - id: hk-01
          connection_source: terraform_cmdb
          cmdb_selector:
            node_id: ap-prod-hk
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph-mnl
      entrypoint:
        fqdn: PH-XConnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: ph-surfercloud-01
        dns_record:
          type: A
          target_node: ph-surfercloud-01
          ttl: 1
          proxied: false
      nodes:
        - id: ph-surfercloud-01
          # PH is a manually provisioned Ubuntu host. Its address and login
          # user are safe deployment metadata; only SSH_PASSWORD is kept in
          # the referenced per-region Vault secret.
          connection_source: vault
          ansible_host: 165.154.233.239
          ansible_user: ubuntu
          credentials_vault_path: prod/XConnect/PH
          enabled: true
          role: standalone
          weight: 100
          provider: surfercloud
          product: ulighthost
  connection_sources:
    terraform_cmdb:
      artifact: cmdb.json
      required_fields: [ip, ansible_user, instance_id, node_id]
      ssh_auth: deploy_key
    vault:
      engine_mount_point: kv
      required_fields: [SSH_PASSWORD]
      ssh_auth: password
