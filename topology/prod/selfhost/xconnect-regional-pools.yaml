apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectRegionalPools
metadata:
  name: xconnect
  project: svc.plus
  environment: prod
spec:
  lifecycle: manual
  provisioning:
    managed_by: manual
    iac_status: planned
  entrypoint_defaults:
    dns_record:
      zone: svc.plus
      type: A
      ttl: 1
      proxied: false
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  aliases:
    pools:
      hp: ph
    regions:
      hp: ph-mnl
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: jp-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: jp-01
      legacy_entrypoints:
        - fqdn: tky-proxy.svc.plus
          type: CNAME
          target: jp-xconnect.svc.plus
      nodes:
        - id: jp-01
          vault_key: jp-01
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: us-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: us-01
      nodes:
        - id: us-01
          vault_key: us-01
          enabled: true
          role: standalone
          weight: 100
    - name: hk
      region: hk
      entrypoint:
        fqdn: hk-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: hk-01
      nodes:
        - id: hk-01
          vault_key: hk-01
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph-mnl
      entrypoint:
        fqdn: ph-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: ph-surfercloud-01
      nodes:
        - id: ph-surfercloud-01
          vault_key: ph-surfercloud-01
          provider: surfercloud
          product: ulighthost
          enabled: true
          role: standalone
          weight: 100
  connection:
    # Preserve the existing secret location; playbooks may override it with
    # XCONNECT_VAULT_PATH during a future managed migration.
    vault_secret: kv/prod/ulighthost-xconnect
    secret_fields:
      - public_ipv4
      - ansible_user
      - ansible_password
